services:
  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules
    environment:
      - API_URL=http://backend:5000
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      target: build
    command: npm run dev
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - PORT=5000
      - CHOKIDAR_USEPOLLING=true
    env_file:
      - path: ./backend/.env
        required: false